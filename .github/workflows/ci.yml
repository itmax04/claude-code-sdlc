name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (scripts and hooks)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python -m unittest discover -s tests -v
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/sdlc/.claude-plugin/plugin.json plugins/sdlc/hooks/hooks.json plugins/sdlc/profiles/*/*.json; do python -m json.tool "$f" >/dev/null; done
